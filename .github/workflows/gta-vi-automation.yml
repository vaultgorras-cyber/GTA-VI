
name: GTA VI Video Automation

on:
  workflow_dispatch:

  schedule:
    # Radar: cada 15 minutos
    - cron: "*/15 * * * *"

    # Generación de vídeos: tres veces al día (UTC)
    - cron: "0 8,14,20 * * *"

permissions:
  contents: write

concurrency:
  group: gta-vi
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and voice fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # RADAR: se ejecuta en cada activación programada
      - name: Run GTA VI radar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
        run: python scripts/radar_gta6.py

      # GENERACIÓN: solo manualmente o en los tres horarios diarios
      - name: Generate GTA VI video
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            github.event.schedule == '0 8,14,20 * * *'
          }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/make_short.py

      # SUBIDA: nunca se ejecuta en las activaciones del radar solamente
      - name: Upload privately for review
        if: >-
          ${{
            vars.ENABLE_PRIVATE_UPLOAD == 'true' &&
            (
              github.event_name == 'workflow_dispatch' ||
              github.event.schedule == '0 8,14,20 * * *'
            )
          }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: Commit state and previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data output
          git diff --cached --quiet || (
            git commit -m "Update GTA VI automation"
            git push
          )

      - name: Save video preview
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            github.event.schedule == '0 8,14,20 * * *'
          }}
        uses: actions/upload-artifact@v4
        with:
          name: gta-vi-video-preview
          path: output/
          if-no-files-found: ignore
          retention-days: 7
